<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon & Majica ❤️</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
    <div class="login-box">
        <div class="logo-heart">❤️</div>
        <h1>Leon & Majica</h1>
        <p>Our Private Memories</p>

        <input id="loginUsername" type="text" placeholder="Username">
        <input id="loginPassword" type="password" placeholder="Password">

        <button onclick="login()">Enter Our Memories</button>

        <p id="loginError" class="error"></p>
    </div>
</div>


<!-- WEBSITE -->
<div id="website" class="hidden">

    <header class="topbar">
        <div class="brand">❤️ Leon & Majica</div>

        <nav>
            <button onclick="showSection('homeSection')">Home</button>
            <button onclick="showSection('albumsSection')">📸 Albums</button>
            <button onclick="showSection('videosSection')">🎬 Videos</button>
            <button onclick="showSection('playlistsSection')">🎵 Music</button>
            <button onclick="showSection('messagesSection')">💌 Messages</button>
            <button onclick="showSection('uploadSection')">➕ Add</button>
            <button onclick="showSection('settingsSection')">⚙️ Settings</button>
        </nav>

        <button onclick="logout()" class="logout">Logout</button>
    </header>


    <main>

        <!-- HOME -->
        <section id="homeSection" class="section">

            <div class="hero">
                <div class="hero-content">
                    <p>OUR STORY</p>
                    <h1>Leon & Majica ❤️</h1>
                    <h3>Every memory has a story.</h3>
                </div>
            </div>

            <h2>Recently Added</h2>
            <div id="recentMemories" class="grid"></div>

        </section>


        <!-- ALBUMS -->
        <section id="albumsSection" class="section hidden">

            <div class="section-title">
                <div>
                    <p>PHOTO COLLECTIONS</p>
                    <h2>Our Albums 📸</h2>
                </div>

                <button onclick="openAlbumManager()">+ New Album</button>
            </div>

            <div id="albumGallery" class="grid"></div>

            <div id="albumViewer" class="hidden">
                <button onclick="closeAlbum()">← Back</button>
                <h2 id="albumViewerTitle"></h2>
                <div id="albumMemoryGallery" class="grid"></div>
            </div>

        </section>


        <!-- VIDEOS -->
        <section id="videosSection" class="section hidden">

            <div class="section-title">
                <div>
                    <p>VIDEO COLLECTIONS</p>
                    <h2>Our Videos 🎬</h2>
                </div>

                <button onclick="openVideoFolderManager()">+ New Folder</button>
            </div>

            <div id="videoGallery" class="grid"></div>

        </section>


        <!-- MUSIC -->
        <section id="playlistsSection" class="section hidden">

            <div class="section-title">
                <div>
                    <p>OUR SOUNDTRACK</p>
                    <h2>Music 🎵</h2>
                </div>

                <button onclick="openPlaylistManager()">+ New Playlist</button>
            </div>

            <div id="playlistGallery" class="grid"></div>

            <div id="playlistViewer" class="hidden">
                <button onclick="closePlaylist()">← Back</button>
                <h2 id="playlistViewerTitle"></h2>
                <div id="playlistSongs"></div>
            </div>

        </section>


        <!-- MESSAGES -->
        <section id="messagesSection" class="section hidden">

            <div class="section-title">
