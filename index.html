<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leon & Jamaica ❤️</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="heart">❤️</div>

        <h1>Leon & Jamaica</h1>

        <p>Our Private Memories</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Enter Our Memories
        </button>

        <p id="loginMessage"></p>

    </div>

</div>


<div id="mainPage" class="hidden">

    <header>

        <h1>Leon & Jamaica ❤️</h1>

        <p>Our little place of memories</p>

        <button onclick="logout()" class="logout">
            Logout
        </button>

    </header>


    <nav>

        <button onclick="showSection('photos')">
            📸 Photos
        </button>

        <button onclick="showSection('videos')">
            🎥 Videos
        </button>

        <button onclick="showSection('music')">
            🎵 Music
        </button>

        <button onclick="showSection('messages')">
            💌 Messages
        </button>

        <button onclick="showSection('upload')">
            ➕ Add Memory
        </button>

    </nav>


    <main>

        <section id="photos" class="section">

            <h2>📸 Our Photos</h2>

            <div id="photoGallery" class="gallery"></div>

        </section>


        <section id="videos" class="section hidden">

            <h2>🎥 Our Videos</h2>

            <div id="videoGallery"></div>

        </section>


        <section id="music" class="section hidden">

            <h2>🎵 Our Music</h2>

            <div id="musicGallery"></div>

        </section>


        <section id="messages" class="section hidden">

            <h2>💌 Our Messages</h2>

            <div id="messageGallery"></div>

        </section>


        <!-- UPLOAD SECTION -->

        <section id="upload" class="section hidden">

            <h2>➕ Add a Memory</h2>

            <p>Save a new photo, video, or song to our memories.</p>

            <div class="upload-box">

                <label for="memoryType">
                    What are you uploading?
                </label>

                <select id="memoryType">

                    <option value="photo">
                        📸 Photo
                    </option>

                    <option value="video">
                        🎥 Video
                    </option>

                    <option value="music">
                        🎵 Music
                    </option>

                </select>


                <label for="memoryFiles">
                    Choose file(s)
                </label>

                <input
                    type="file"
                    id="memoryFiles"
                    multiple
                    accept="image/*,video/*,audio/*"
                >


                <button
                    type="button"
                    onclick="uploadMemories()"
                    id="uploadButton"
                >
                    ❤️ Upload Memory
                </button>

                <p id="uploadStatus"></p>

                <div id="uploadProgress"></div>

            </div>

        </section>

    </main>

</div>


<script src="app.js"></script>

</body>
</html>
